[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toolism"
dynamic = ["version"]
description = "Measure and safely slim the token cost of LLM tool and MCP schemas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rakesh Singh" }]
keywords = ["llm", "mcp", "tokens", "json-schema", "agents", "function-calling", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
verify = ["hypothesis>=6.100", "hypothesis-jsonschema>=0.23", "jsonschema>=4.21"]
mcp = ["mcp>=1.2"]
anthropic = ["anthropic>=0.40"]
all = ["toolism[verify,mcp,anthropic]"]

[project.scripts]
toolism = "toolism.cli:main"

[project.urls]
Homepage = "https://github.com/rakeshnitb23/toolism"
Repository = "https://github.com/rakeshnitb23/toolism"
Issues = "https://github.com/rakeshnitb23/toolism/issues"
Changelog = "https://github.com/rakeshnitb23/toolism/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "toolism[all]",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-github-actions-annotate-failures>=0.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "pydantic>=2.7",
]

[tool.hatch.version]
path = "src/toolism/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toolism"]

[tool.hatch.build.targets.sdist]
include = ["src/toolism", "tests", "README.md", "LICENSE", "CHANGELOG.md", "action.yml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLC", "PLE", "PLW", "PT", "C4", "PIE", "RET"]
ignore = [
  "PLC0415",  # lazy imports of optional/heavy dependencies are deliberate (design C0)
  "PLW2901",  # loop variable overwritten: clearer in transform code
  "RUF001",   # ambiguous unicode in strings: we print arrows and ellipses on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["toolism"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/toolism"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tiktoken.*", "hypothesis_jsonschema.*", "jsonschema.*", "anthropic.*", "mcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "network: needs network access (e.g. tiktoken vocabulary download)",
  "mcp: needs the mcp extra and spawns a local MCP server",
  "slow: slow test",
]
filterwarnings = ["error::DeprecationWarning:toolism.*"]

[tool.coverage.run]
source = ["toolism"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]
