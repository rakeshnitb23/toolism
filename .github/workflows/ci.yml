name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
  FORCE_COLOR: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Cache tiktoken vocabulary
        uses: actions/cache@v4
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-${{ runner.os }}-v1
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not slow" --cov --cov-report=term-missing

  bench-equivalence:
    name: bench equivalence (real servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m slow tests/test_bench.py

  dogfood:
    name: dogfood (our own action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolslim
        uses: ./
        with:
          source: bench/snapshots/fastmcp-pydantic.json
          baseline: .toolslim/baseline.json
          max-increase: "5%"
      - name: Check the action's outputs
        env:
          STATUS: ${{ steps.toolslim.outputs.status }}
          TOTAL: ${{ steps.toolslim.outputs.total }}
          DELTA: ${{ steps.toolslim.outputs.delta }}
        run: |
          echo "status=$STATUS total=$TOTAL delta=$DELTA"
          test "$STATUS" = pass
          test -n "$TOTAL"
