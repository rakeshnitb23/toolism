name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
  FORCE_COLOR: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spell check with typos
        uses: crate-ci/typos@v1.51.1

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Cache tiktoken vocabulary
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-${{ runner.os }}-v1
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not slow" --cov --cov-report=term-missing

  policy-script:
    name: assignment policy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test .github/scripts/assignment-policy.test.js

  leaderboard-script:
    name: leaderboard script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uvx pytest .github/scripts -p no:cacheprovider

  bench-equivalence:
    name: bench equivalence (real servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m slow tests/test_bench.py

  package:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  package-install:
    name: package install
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run the built wheel, without the source tree
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)" toolism measure examples/mcp_tools.json -t heuristic

  dogfood:
    name: dogfood (our own action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: toolism
        uses: ./
        with:
          source: bench/snapshots/fastmcp-pydantic.json
          baseline: .toolism/baseline.json
          max-increase: "5%"
      - name: Check the action's outputs
        env:
          STATUS: ${{ steps.toolism.outputs.status }}
          TOTAL: ${{ steps.toolism.outputs.total }}
          DELTA: ${{ steps.toolism.outputs.delta }}
        run: |
          echo "status=$STATUS total=$TOTAL delta=$DELTA"
          test "$STATUS" = pass
          test -n "$TOTAL"
